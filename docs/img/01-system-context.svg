<text x="55.0" y="457.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">products and the agent feed · merchant policy document</text>
<text x="55.0" y="472.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">agent keys, hashed at rest · one merchant, one process</text>
<rect x="420" y="418" width="362" height="62" rx="9" fill="#fdf2df" stroke="#a06a12" stroke-width="1.4"/>
<text x="433.0" y="442.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">enrichment.py · crosssell.py — the model</text>
<text x="433.0" y="457.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">category metadata a human must approve before the gate</text>
<text x="433.0" y="472.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">≤ 2 add-ons from a pre-filtered set; the gate re-judges</text>
<rect x="42" y="498" width="740" height="36" rx="9" fill="#e4f3f2" stroke="#177b7b" stroke-width="1.4"/>
