<rect x="42" y="76" width="366" height="50" rx="9" fill="#f0f0ee" stroke="#6b7280" stroke-width="1.4"/>
<text x="55.0" y="100.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">Buyer agent (LLM)</text>
<text x="55.0" y="115.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">outside the boundary · everything it sends is untrusted</text>
<rect x="420" y="76" width="362" height="50" rx="9" fill="#f0f0ee" stroke="#6b7280" stroke-width="1.4"/>
<text x="433.0" y="100.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">Merchant (human)</text>
<text x="433.0" y="115.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">approves catalog metadata, reviews big orders, refunds</text>
<rect x="42" y="176" width="366" height="62" rx="9" fill="#e8f1f8" stroke="#2b5f8e" stroke-width="1.4"/>
<text x="55.0" y="200.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">api.py — agent API</text>
<text x="55.0" y="215.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">ACP-shaped checkout sessions · discovery · webhook</text>
<text x="55.0" y="230.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">Bearer agk_… per agent · Idempotency-Key required</text>
<rect x="420" y="176" width="362" height="62" rx="9" fill="#e8f1f8" stroke="#2b5f8e" stroke-width="1.4"/>
<text x="433.0" y="200.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">dashboard.py — merchant console</text>
<text x="433.0" y="215.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">products · agents · policy · sessions · ledger</text>
<text x="433.0" y="230.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">approve enrichment, review orders, refund, verify</text>
<rect x="42" y="254" width="740" height="50" rx="9" fill="#e8f1f8" stroke="#2b5f8e" stroke-width="1.4"/>
<text x="55.0" y="278.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">sessions.py — the session state machine</text>
<text x="55.0" y="293.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">the only code path that creates a Payment Link, and only after ALLOW plus a mandate reservation</text>
<rect x="42" y="322" width="176" height="78" rx="9" fill="#e8f1f8" stroke="#2b5f8e" stroke-width="1.4"/>
<text x="55.0" y="346.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">gate.py</text>
<text x="55.0" y="361.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">15 purchase rules</text>
<text x="55.0" y="376.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">5 refund rules</text>
<text x="55.0" y="391.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">pure, never raises</text>
<rect x="230" y="322" width="176" height="78" rx="9" fill="#e8f1f8" stroke="#2b5f8e" stroke-width="1.4"/>
<text x="243.0" y="346.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="13.0" fill="#1b1f24" text-anchor="start" font-weight="600">mandates.py</text>
<text x="243.0" y="361.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">per-agent caps</text>
<text x="243.0" y="376.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">reserve, commit, release</text>
<text x="243.0" y="391.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="11.0" fill="#5f6b7a" text-anchor="start" font-weight="normal">refunds give budget back</text>
<rect x="418" y="322" width="176" height="78" rx="9" fill="#efeafb" stroke="#6244a8" stroke-width="1.4"/>
