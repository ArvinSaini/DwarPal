<circle cx="534" cy="461.5" r="9.5" fill="#ffffff" stroke="#7d8894" stroke-width="1.2"/>
<text x="534.0" y="465.1" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#39434f" text-anchor="middle" font-weight="700">8</text>
<text x="550.0" y="465.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#39434f" text-anchor="start" font-weight="normal">complete DENY → 409 policy_denied · a provider error releases and returns 502</text>
<circle cx="534" cy="482.5" r="9.5" fill="#ffffff" stroke="#7d8894" stroke-width="1.2"/>
<text x="534.0" y="486.1" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#39434f" text-anchor="middle" font-weight="700">9</text>
