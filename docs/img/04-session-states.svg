<circle cx="534" cy="503.5" r="9.5" fill="#ffffff" stroke="#7d8894" stroke-width="1.2"/>
<text x="534.0" y="507.1" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#39434f" text-anchor="middle" font-weight="700">10</text>
<text x="550.0" y="507.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#39434f" text-anchor="start" font-weight="normal">a captured payment commits the reservation: reserved money becomes spent money</text>
<circle cx="534" cy="524.5" r="9.5" fill="#ffffff" stroke="#7d8894" stroke-width="1.2"/>
<text x="534.0" y="528.1" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#39434f" text-anchor="middle" font-weight="700">11</text>
<text x="550.0" y="528.0" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#39434f" text-anchor="start" font-weight="normal">second failure abandons · cancel releases; a refused cancel gets a final poll</text>
<circle cx="534" cy="545.5" r="9.5" fill="#ffffff" stroke="#7d8894" stroke-width="1.2"/>
<text x="534.0" y="549.1" font-family="Segoe UI, Noto Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#39434f" text-anchor="middle" font-weight="700">12</text>
